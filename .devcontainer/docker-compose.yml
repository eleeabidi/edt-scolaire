services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ../..:/workspaces:cached
        command: sleep infinity
        depends_on:
            - mysql

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: edt_scolaire
            MYSQL_ROOT_PASSWORD: password
        # Les données restent dans ce volume quand le Codespace s'arrête
        volumes:
            - mysql-data:/var/lib/mysql

volumes:
    mysql-data:
